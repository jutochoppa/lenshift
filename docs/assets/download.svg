<svg xmlns="http://www.w3.org/2000/svg" width="440" height="100" viewBox="0 0 440 100" role="img" aria-labelledby="download-title">
  <title id="download-title">Download Lenshift for Android</title>
  <defs>
    <linearGradient id="fill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#74F2D5"/>
      <stop offset="1" stop-color="#3CC9AA"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-30%" width="120%" height="170%">
      <feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#3CC9AA" flood-opacity="0.35"/>
    </filter>
  </defs>
  <style>
    .big { font: 700 28px 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; fill: #0B1020; }
    .small { font: 600 15px 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; fill: #0B1020; fill-opacity: 0.72; }
    .arrow { animation: nudge 2.4s ease-in-out infinite; }
    @keyframes nudge { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(4px); } }
    @media (prefers-reduced-motion: reduce) { .arrow { animation: none; } }
  </style>
  <rect x="8" y="6" width="424" height="80" rx="40" fill="url(#fill)" filter="url(#shadow)"/>
  <circle cx="56" cy="46" r="27" fill="#0B1020" fill-opacity="0.12"/>
  <g class="arrow" fill="none" stroke="#0B1020" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M56 31 V55"/>
    <path d="M46 46 L56 56 L66 46"/>
  </g>
  <path d="M44 63 H68" stroke="#0B1020" stroke-width="4.5" stroke-linecap="round"/>
  <text class="big" x="100" y="45">Download APK</text>
  <text class="small" x="101" y="68">Lenshift for Android 11 or newer</text>
</svg>
